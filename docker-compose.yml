services:
  db:
    image: mysql:8.0
    container_name: finance-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/finance-backend:latest
    container_name: finance-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME}/finance-frontend:latest
    container_name: finance-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
